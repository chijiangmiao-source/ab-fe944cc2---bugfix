# 冰川洞穴染料示踪 · 全局最小汇流树
#
# 启动：
#   docker compose up --build          # 常驻运行 web + api
#   docker compose run --rm verify     # 一次性核对服务（测试 + 构建 + 真实 API/页面核对）
#
# 端口可经环境变量 / .env 配置：
#   WEB_PORT（宿主侧页面端口，默认 8080）
#   API_PORT（宿主侧 API 端口，默认 8000）
#
# verify 服务先等待 api、web 健康检查通过，随后执行后端单元测试、前端测试与
# 生产构建，并对真实 API 与经页面同源反代的结果做样例核对与 HTTP 冒烟，
# 全部通过以退出码 0 报告，否则非零。

services:
  api:
    build:
      context: ./api
    image: glacier-arborescence-api:latest
    ports:
      - "${API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=2).status == 200 else 1)"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped

  web:
    build:
      context: ./web
    image: glacier-arborescence-web:latest
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 3s
    restart: unless-stopped

  verify:
    build:
      context: .
      dockerfile: verify/Dockerfile
    image: glacier-arborescence-verify:latest
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    restart: "no"
